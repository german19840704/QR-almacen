<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buscador Almacén</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#6c7680;--line:#dde3e8;--accent:#176b45;--accent2:#eaf5ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.app{max-width:680px;margin:auto;min-height:100vh}header{background:var(--accent);color:#fff;padding:17px 15px;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0002}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
.controls{padding:12px;position:sticky;top:72px;background:var(--bg);z-index:3}select,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;margin-bottom:8px}select:focus,input:focus{border-color:var(--accent)}
.meta{padding:0 14px 7px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px}.list{padding:0 11px 28px}.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 0;box-shadow:0 1px 4px #0001}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ref{font-weight:800;font-size:15px;word-break:break-word}.loc{font-weight:800;background:var(--accent2);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:12px;white-space:nowrap}.desc{font-size:14px;line-height:1.32;margin-top:5px}.foot{font-size:12px;color:var(--muted);margin-top:7px}.empty{text-align:center;color:var(--muted);padding:38px 18px}.loading{text-align:center;color:var(--muted);padding:42px 18px}.badge{font-size:11px;opacity:.86;margin-top:3px}
</style>
</head>
<body><div class="app">
<header><h1>🔎 Buscador del almacén</h1><div class="sub">Artículo · referencia · descripción · ubicación</div><div class="badge">Base actualizada · 5.663 artículos</div></header>
<div id="loading" class="loading">Cargando base actualizada…</div>
<div id="app" hidden>
<div class="controls">
<select id="maker"><option value="">Todos los fabricantes</option></select>
<select id="aisle"><option value="">Todos los pasillos</option></select>
<select id="shelf" disabled><option value="">Todas las estanterías</option></select>
<input id="q" type="search" autocomplete="off" placeholder="Buscar artículo, referencia, descripción o ubicación…">
</div>
<div class="meta"><span id="count"></span><span id="total"></span></div>
<div id="list" class="list"></div><div id="empty" class="empty" hidden>No hay resultados.</div>
</div></div>
<script>
const PARTS=['data/v3_01.txt','data/v3_02.txt','data/v3_03.txt','data/v3_04.txt','data/v3_05.txt','data/v3_06.txt','data/v3_07.txt','data/v3_08.txt','data/v3_09.txt','data/v3_10.txt','data/v3_11.txt','data/v3_12.txt'];
let DATA=[];
const q=document.getElementById('q'),maker=document.getElementById('maker'),aisle=document.getElementById('aisle'),shelf=document.getElementById('shelf'),list=document.getElementById('list'),count=document.getElementById('count'),total=document.getElementById('total'),empty=document.getElementById('empty');
function norm(s){return(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function esc(s){return(s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function displayLoc(u){let s=(u||'').toString().trim();s=s.replace(/^A1E4(?=R|-|$)/i,'A1E3');s=s.replace(/^A2E4(?=R|-|$)/i,'A2E3');s=s.replace(/^A3E1LATE(?=R|-|$)/i,'A3E1 LATERAL');s=s.replace(/^1P3\s*PAR(?=E|R|-|$)/i,'1P3 PARED');s=s.replace(/^1P3\s*PAREDE?D?(?=R|-|$)/i,'1P3 PARED');s=s.replace(/^B3E5(?=R|-|$)/i,'B3E4');s=s.replace(/^BC4(?=E|R|-|$)/i,'B40');s=s.replace(/^N2B([789])(?=E|R|-|$)/i,'(N2)$1');s=s.replace(/^N20(?=E|R|-|$)/i,'B20');return s}
function locParts(u){const s=displayLoc(u);let m=s.match(/^PE([1-5])E([^R-]+)/i);if(m)return{aisle:'PE'+m[1],shelf:m[2]};if(/^(?:NAVE\s*2|NAV)/i.test(s))return{aisle:'NAVE2',shelf:/PLANTA\s*2/i.test(s)?'PLANTA 2':'PLANTA BAJA'};m=s.match(/^A3E1\s*LATERAL/i);if(m)return{aisle:'A3',shelf:'1 LATERAL'};m=s.match(/^1P3\s*PARED/i);if(m)return{aisle:'1P3 PARED',shelf:'PARED'};m=s.match(/^(.+?)E([^R-]+)/i);return m?{aisle:m[1],shelf:m[2]}:{aisle:'',shelf:''}}
function aisleOf(u){return locParts(u).aisle}
function shelfOf(u){return locParts(u).shelf}
function shelfLabel(ai,v){if(ai==='NAVE2'&&v==='PLANTA BAJA')return 'Planta baja';if(ai==='NAVE2'&&v==='PLANTA 2')return 'Planta 2';if(ai==='A3'&&v==='1 LATERAL')return '1 LATERAL';if(ai==='1P3 PARED'&&v==='PARED')return 'PARED';return 'Estantería '+v}
function fillShelves(){const ai=aisle.value;let vals=ai?[...new Set(DATA.filter(x=>aisleOf(x.u)===ai).map(x=>shelfOf(x.u)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})):[];if(ai==='NAVE2')vals=['PLANTA BAJA','PLANTA 2'];shelf.innerHTML='<option value="">Todas las estanterías</option>';for(const v of vals){const o=document.createElement('option');o.value=v;o.textContent=shelfLabel(ai,v);shelf.appendChild(o)}shelf.disabled=!ai;shelf.value=''}
function cards(rows){return rows.slice(0,300).map(x=>`<div class="item"><div class="top"><div class="ref">${esc(x.r||x.a||'Sin referencia')}</div><div class="loc">${esc(displayLoc(x.u)||'SIN UBICACIÓN')}</div></div><div class="desc">${esc(x.d||'')}</div><div class="foot">Artículo: ${esc(x.a||'')} · ${esc(x.f||'')}</div></div>`).join('')+(rows.length>300?'<div class="empty">Mostrando los primeros 300 resultados. Afina la búsqueda.</div>':'')}
function render(){const terms=norm(q.value).split(/\s+/).filter(Boolean),mf=maker.value,ai=aisle.value,sh=shelf.value;const rows=DATA.filter(x=>{if(mf&&x.f!==mf)return false;if(ai&&aisleOf(x.u)!==ai)return false;if(sh&&shelfOf(x.u)!==sh)return false;if(!terms.length)return true;const hay=norm([x.a,x.r,x.d,x.u,displayLoc(x.u),x.f].join(' '));return terms.every(t=>hay.includes(t))});count.textContent=rows.length.toLocaleString('es-ES')+(rows.length===1?' resultado':' resultados');list.innerHTML=cards(rows);empty.hidden=rows.length>0}
async function loadData(){if(!('DecompressionStream' in window))throw new Error('Este navegador necesita una versión más reciente para abrir la base');const texts=await Promise.all(PARTS.map(p=>fetch(p+'?v=5663-20260904',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar '+p);return r.text()})));const b64=texts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const text=await new Response(stream).text();const rows=JSON.parse(text);const base=rows.map(x=>({f:x[0]||'',a:x[1]||'',r:x[2]||'',d:x[3]||'',u:x[4]||''}));const [rointeRows,tekoxRows]=await Promise.all([fetch('data/rointe_fix.json?v=20260904-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la corrección de Rointe');return r.json()}),fetch('data/tekox_fix.json?v=20260904-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la corrección de TEKOX');return r.json()})]);const mapFix=(arr,def)=>arr.map(x=>({f:x.fabricante||def,a:x.articulo||'',r:x.referencia||'',d:x.descripcion||'',u:x.ubicacion||''}));const fixes=mapFix(rointeRows,'Rointe').concat(mapFix(tekoxRows,'TEKOX'));return base.filter(x=>!['rointe','tekox'].includes(norm(x.f))).concat(fixes)}
async function init(){try{DATA=await loadData();if(DATA.length!==5663)throw new Error('Base incompleta: '+DATA.length+' artículos');const makers=[...new Set(DATA.map(x=>x.f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));for(const v of makers){const o=document.createElement('option');o.value=v;o.textContent=v;maker.appendChild(o)}const aisles=[...new Set(DATA.map(x=>aisleOf(x.u)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));for(const v of aisles){const o=document.createElement('option');o.value=v;o.textContent='Pasillo '+v;aisle.appendChild(o)}const params=new URLSearchParams(location.search);const est=params.get('est');if(est){const p=locParts(est);if(p.aisle&&aisles.includes(p.aisle)){aisle.value=p.aisle;fillShelves();if(p.shelf&&[...shelf.options].some(o=>o.value===p.shelf))shelf.value=p.shelf}}total.textContent=DATA.length.toLocaleString('es-ES')+' artículos · '+makers.length+' fabricantes';document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false;render()}catch(e){document.getElementById('loading').innerHTML='Error cargando artículos.<br><small>'+esc(e.message)+'</small>'}}
q.addEventListener('input',render);maker.addEventListener('change',render);aisle.addEventListener('change',()=>{fillShelves();render()});shelf.addEventListener('change',render);init();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buscador Almacén</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18212b;--muted:#6c7680;--line:#dde3e8;--accent:#176b45;--accent2:#eaf5ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.app{max-width:680px;margin:auto;min-height:100vh}header{background:var(--accent);color:#fff;padding:17px 15px;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0002}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
.controls{padding:12px;position:sticky;top:72px;background:var(--bg);z-index:3}select,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;margin-bottom:8px}select:focus,input:focus{border-color:var(--accent)}
.meta{padding:0 14px 7px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:8px}.list{padding:0 11px 28px}.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 0;box-shadow:0 1px 4px #0001}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ref{font-weight:800;font-size:15px;word-break:break-word}.loc{font-weight:800;background:var(--accent2);color:var(--accent);padding:5px 8px;border-radius:999px;font-size:12px;white-space:nowrap}.desc{font-size:14px;line-height:1.32;margin-top:5px}.foot{font-size:12px;color:var(--muted);margin-top:7px}.empty{text-align:center;color:var(--muted);padding:38px 18px}.loading{text-align:center;color:var(--muted);padding:42px 18px}
</style>
</head>
<body><div class="app">
<header><h1>🔎 Buscador del almacén</h1><div class="sub">Artículo · referencia · descripción · ubicación</div></header>
<div id="loading" class="loading">Cargando artículos…</div>
<div id="app" hidden>
<div class="controls">
<select id="maker"><option value="">Todos los fabricantes</option></select>
<select id="aisle"><option value="">Todos los pasillos</option></select>
<input id="q" type="search" autocomplete="off" placeholder="Buscar artículo, referencia, descripción o ubicación…">
</div>
<div class="meta"><span id="count"></span><span id="total"></span></div>
<div id="list" class="list"></div><div id="empty" class="empty" hidden>No hay resultados.</div>
</div></div>
<script>
const DATA_SOURCE='https://raw.githubusercontent.com/german19840704/QR-almacen/523b61d0b0bf7054be43a4356e2944d83852c530/Almacen_QR_prototipo.html';
let DATA=[];
const q=document.getElementById('q'), maker=document.getElementById('maker'), aisle=document.getElementById('aisle'), list=document.getElementById('list'), count=document.getElementById('count'), total=document.getElementById('total'), empty=document.getElementById('empty');
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function aisleOf(u){const m=(u||'').match(/^([^E]+)E/);return m?m[1]:''}
function cards(rows){return rows.slice(0,300).map(x=>`<div class="item"><div class="top"><div class="ref">${esc(x.r||x.a||'Sin referencia')}</div><div class="loc">${esc(x.u||'SIN UBICACIÓN')}</div></div><div class="desc">${esc(x.d||'')}</div><div class="foot">Artículo: ${esc(x.a||'')} · ${esc(x.f||'')}</div></div>`).join('')+(rows.length>300?'<div class="empty">Mostrando los primeros 300 resultados. Afina la búsqueda.</div>':'')}
function render(){const terms=norm(q.value).split(/\s+/).filter(Boolean), mf=maker.value, ai=aisle.value;const rows=DATA.filter(x=>{if(mf&&x.f!==mf)return false;if(ai&&aisleOf(x.u)!==ai)return false;if(!terms.length)return true;const hay=norm([x.a,x.r,x.d,x.u,x.f].join(' '));return terms.every(t=>hay.includes(t))});count.textContent=rows.length+(rows.length===1?' resultado':' resultados');list.innerHTML=cards(rows);empty.hidden=rows.length>0}
async function init(){try{const raw=await fetch(DATA_SOURCE,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});const m=raw.match(/const DATA=(\[[\s\S]*?\]);/);if(!m)throw new Error('No se localizaron los datos');DATA=JSON.parse(m[1]);const makers=[...new Set(DATA.map(x=>x.f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));for(const v of makers){const o=document.createElement('option');o.value=v;o.textContent=v;maker.appendChild(o)}const aisles=[...new Set(DATA.map(x=>aisleOf(x.u)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));for(const v of aisles){const o=document.createElement('option');o.value=v;o.textContent='Pasillo '+v;aisle.appendChild(o)}total.textContent=DATA.length.toLocaleString('es-ES')+' artículos';document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false;render()}catch(e){document.getElementById('loading').innerHTML='Error cargando artículos.<br><small>'+esc(e.message)+'</small>'}}
q.addEventListener('input',render);maker.addEventListener('change',render);aisle.addEventListener('change',render);init();
</script></body></html>

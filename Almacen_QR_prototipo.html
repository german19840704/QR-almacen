.app{max-width:620px;margin:auto;min-height:100vh}

.list{padding:0 11px 28px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:8px 0;box-shadow:0 1px 4px #0001}

.empty{text-align:center;color:var(--muted);padding:38px 18px}
.note{padding:0 14px 20px;color:var(--muted);font-size:11px;text-align:center}

const fullList=document.getElementById('fullList'), fullCount=document.getElementById('fullCount'), fullMaker=document.getElementById('fullMaker'), fullEmpty=document.getElementById('fullEmpty');
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function rackOf(s){return (s||'').replace(/E\d+$/,'')}
for(const s of shelves){const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)}
const params=new URLSearchParams(location.search); const requested=params.get('est')||'B1E1'; const initial=shelves.includes(requested)?requested:(shelves.find(s=>rackOf(s)===requested)||shelves[0]||''); const rack=rackOf(requested)||rackOf(initial);
sel.value=initial;
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cards(rows){return rows.map(x=>`<div class="item">
  <div class="top"><div class="ref">${esc(x.r||x.a||'Sin referencia')}</div><div class="loc">${esc(x.u)}</div></div>
  <div class="desc">${esc(x.d)}</div>
  <div class="foot">Artículo: ${esc(x.a)}${x.f?' · '+esc(x.f):''}</div>
 </div>`).join('')}
function render(){
 const shelf=sel.value, term=norm(q.value.trim());
 const rows=DATA.filter(x=>x.e===shelf && (!term || norm([x.a,x.r,x.d,x.u,x.f].join(' ')).includes(term)));
 title.textContent='Estantería '+shelf;
 const makers=[...new Set(DATA.filter(x=>x.e===shelf).map(x=>x.f).filter(Boolean))];
 maker.textContent=makers.length===1?makers[0]:makers.length+' fabricantes';
 count.textContent=rows.length+(rows.length===1?' resultado':' resultados');
 list.innerHTML=cards(rows);
 empty.hidden=rows.length>0;
 const url=new URL(location.href); url.searchParams.set('est',shelf); history.replaceState(null,'',url);
}
function renderFull(){
 const rows=DATA.filter(x=>rackOf(x.e)===rack);
 const makers=[...new Set(rows.map(x=>x.f).filter(Boolean))];
 title.textContent='Estantería '+rack;
 document.getElementById('subtitle').textContent='Todos los artículos de la estantería';
 fullCount.textContent=rows.length+(rows.length===1?' artículo':' artículos');
 fullMaker.textContent=makers.length===1?makers[0]:makers.length+' fabricantes';
 fullList.innerHTML=cards(rows); fullEmpty.hidden=rows.length>0;
}
function show(screen){
 home.hidden=screen!=='home'; searchScreen.hidden=screen!=='search'; fullScreen.hidden=screen!=='full';
 if(screen==='home'){title.textContent='Estantería '+rack;document.getElementById('subtitle').textContent='¿Qué quieres consultar?'}
 if(screen==='search'){document.getElementById('subtitle').textContent='Datos del buscador maestro';render();}
 if(screen==='full')renderFull();
}
document.getElementById('searchChoice').addEventListener('click',()=>show('search'));
document.getElementById('fullChoice').addEventListener('click',()=>show('full'));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>show('home')));
sel.addEventListener('change',()=>{q.value='';render()}); q.addEventListener('input',render);
document.getElementById('fullChoiceText').textContent='Muestra todos los artículos de la estantería '+rack+'.';
show('home');
</script></body></html>
